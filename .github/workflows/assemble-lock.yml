name: Assemble lockfile

on:
  push:
    paths:
      - .github/workflows/assemble-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate verified slices
        run: |
          python3 - << 'PY'
          import hashlib
          from pathlib import Path
          parts = Path("frontend/.lock-parts")
          data = b"".join((parts / f"{i:02d}").read_bytes() for i in range(53))
          Path("frontend/package-lock.json").write_bytes(data)
          digest = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
          print(digest, len(data))
          expected = "d1c5a4f0df8b0cb72bda28192467391b7038b953"
          if digest != expected or len(data) != 164343:
              raise SystemExit(f"lockfile mismatch: {digest} {len(data)}")
          PY
      - name: Commit assembled lockfile and remove slices
        run: |
          git config user.name "Amier Gabuters"
          git config user.email "159158069+gabutersproject@users.noreply.github.com"
          git add frontend/package-lock.json
          git rm -r frontend/.lock-parts
          git rm .github/workflows/assemble-lock.yml
          git commit -m "Assemble frontend/package-lock.json from verified slices."
          git push origin HEAD:main
